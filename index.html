<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>百词斩风格单词闯关｜最终修复</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system, sans-serif;}
body{background:#ecf8ff;padding:20px;min-height:100vh;}
.container{max-width:480px;margin:0 auto;}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.score{font-size:16px;color:#2d3748}
.progress-wrap{width:100%;height:8px;background:#cce7ff;border-radius:99px;margin-bottom:20px;overflow:hidden;}
.progress-bar{height:100%;background:#007aff;transition:0.3s;}
.flip-card {
  width:100%;
  perspective: 1000px;
  margin-bottom:20px;
}
.flip-card-inner {
  position: relative;
  width: 100%;
  transition: transform 0.6s;
  transform-style: preserve-3d;
}
.flip-card.flipped .flip-card-inner {
  transform: rotateY(180deg);
}
.flip-card-front, .flip-card-back {
  position: relative;
  width:100%;
  -webkit-backface-visibility: hidden;
  backface-visibility: hidden;
  border-radius:20px;
  box-shadow:0 6px 18px #c9e7f5;
  overflow:hidden;
  background:#fff;
}
.flip-card-back {
  transform: rotateY(180deg);
  padding:30px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  margin-top:-100%;
}
.card-img{width:100%;height:auto;display:block;object-fit:contain;background:#f4f8ff;}
.card-body{padding:20px;text-align:center}
.word{font-size:36px;font-weight:bold;color:#222;margin-bottom:6px}
.phonetic{color:#666;font-size:16px;margin-bottom:16px}
.opt-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}
.option{padding:14px;border:2px solid #cce7ff;border-radius:14px;background:#f6fbff;font-size:17px;cursor:pointer;transition:0.25s}
.option:hover{background:#e8f4ff;transform:scale(1.02)}
.option.right{background:#d9f9e8;border-color:#34c759;color:#007024}
.option.wrong{background:#ffe9e9;border-color:#ff3b30;color:#a80000}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
button{padding:12px;border:none;border-radius:14px;font-size:16px;cursor:pointer;transition:0.2s}
#nextBtn{background:#007aff;color:#fff;display:none}
#flipBtn{background:#845ef7;color:#fff}
#resetBtn{background:#ff9500;color:#fff}
#reviewWrongBtn{background:#10b981;color:#fff;display:none}
.tip{height:30px;font-size:20px;font-weight:bold;text-align:center;margin:8px 0}
.result-modal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.4);display:none;align-items:center;justify-content:center;z-index:99}
.modal-box{background:#fff;padding:30px;border-radius:20px;text-align:center;max-width:400px;width:90%}
.modal-box h3{margin-bottom:12px;color:#222}
.modal-box p{margin:8px 0;color:#444;font-size:16px}
.modal-box button{margin-top:16px;background:#007aff;color:#fff;width:100%}
</style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="score">得分：<span id="score">0</span></div>
        <div class="score">正确率：<span id="rate">0%</span></div>
    </div>
    <div class="progress-wrap">
        <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="tip" id="tip"></div>

    <div class="flip-card" id="flipCard">
        <div class="flip-card-inner">
            <div class="flip-card-front">
                <img class="card-img" id="wordImg" src="">
                <div class="card-body">
                    <div class="word" id="enWord"></div>
                    <div class="phonetic" id="phonetic"></div>
                    <div class="opt-wrap" id="optBox"></div>
                </div>
            </div>
            <div class="flip-card-back">
                <div style="font-size:32px;font-weight:bold" id="backEn"></div>
                <div style="font-size:18px;color:#666;margin:10px 0" id="backPh"></div>
                <div style="font-size:24px;color:#007aff" id="backCn"></div>
            </div>
        </div>
    </div>

    <div class="btn-row">
        <button id="flipBtn">翻转卡片查看释义</button>
        <button id="nextBtn">下一题 →</button>
    </div>
    <div class="btn-row" style="margin-top:10px">
        <button id="resetBtn">重新开局(全新随机题目)</button>
        <button id="reviewWrongBtn">复习错题</button>
    </div>
</div>

<div class="result-modal" id="resultModal">
    <div class="modal-box">
        <h3>🎉本轮答题结束</h3>
        <p id="resultText"></p>
        <button onclick="closeModal()">再来一局</button>
    </div>
</div>

<script>
const rawWordList = [
    {en:"apple",phonetic:"/ˈæpl/",cn:"苹果",img:"https://images.unsplash.com/photo-1550258987-190a2d41a8ba?w=480&fit=crop",allOpts:["苹果","香蕉","橙子","葡萄"]},
    {en:"cat",phonetic:"/kæt/",cn:"猫",img:"https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=480&fit=crop",allOpts:["狗","猫","鸟","兔子"]},
    {en:"book",phonetic:"/bʊk/",cn:"书",img:"https://images.unsplash.com/photo-1544947950-fa07a98d237f?w=480&fit=crop",allOpts:["桌子","书","杯子","椅子"]},
    {en:"sun",phonetic:"/sʌn/",cn:"太阳",img:"https://images.unsplash.com/photo-1495616811223-4d98c6e9c869?w=480&fit=crop",allOpts:["月亮","星星","太阳","云朵"]},
    {en:"water",phonetic:"/ˈwɔːtə(r)/",cn:"水",img:"https://images.unsplash.com/photo-1505142468610-359e7d316be0?w=480&fit=crop",allOpts:["石头","火","水","土"]},
    {en:"bird",phonetic:"/bɜːd/",cn:"鸟",img:"https://images.unsplash.com/photo-1552728089-57bdde30beb3?w=480&fit=crop",allOpts:["鱼","鸟","蛇","老鼠"]},
    {en:"bread",phonetic:"/bred/",cn:"面包",img:"https://images.unsplash.com/photo-1509440159596-0249088772ff?w=480&fit=crop",allOpts:["面包","米饭","面条","蛋糕"]},
    {en:"mountain",phonetic:"/ˈmaʊntən/",cn:"山",img:"https://images.unsplash.com/photo-1464852045489-bccb7d17fe39?w=480&fit=crop",allOpts:["河流","山","大海","森林"]},
    {en:"flower",phonetic:"/ˈflaʊə(r)/",cn:"花",img:"https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=480&fit=crop",allOpts:["花","树","草","苔藓"]},
    {en:"car",phonetic:"/kɑː(r)/",cn:"小汽车",img:"https://images.unsplash.com/photo-1494976388531-d1058494cdd8?w=480&fit=crop",allOpts:["自行车","小汽车","火车","飞机"]}
]

const QUESTION_PER_ROUND = 6;
let currentList = [];
let wrongList = [];
let currentIndex = 0;
let rightCnt = 0;
let totalAnswer = 0;
let answered = false;
let startTime = null;

const scoreDom = document.getElementById('score');
const rateDom = document.getElementById('rate');
const tipDom = document.getElementById('tip');
const imgDom = document.getElementById('wordImg');
const enDom = document.getElementById('enWord');
const phoneticDom = document.getElementById('phonetic');
const optBox = document.getElementById('optBox');
const nextBtn = document.getElementById('nextBtn');
const resetBtn = document.getElementById('resetBtn');
const reviewWrongBtn = document.getElementById('reviewWrongBtn');
const flipCard = document.getElementById('flipCard');
const flipBtn = document.getElementById('flipBtn');
const progressBar = document.getElementById('progressBar');
const resultModal = document.getElementById('resultModal');
const resultText = document.getElementById('resultText');
const backEn = document.getElementById('backEn');
const backPh = document.getElementById('backPh');
const backCn = document.getElementById('backCn');

function shuffle(arr){
    const copy = [...arr];
    for(let i = copy.length-1; i>0; i--){
        const j = Math.floor(Math.random()*(i+1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
}

function getRandomRoundQuestions(){
    const shuffledAll = shuffle(rawWordList);
    return shuffledAll.slice(0, QUESTION_PER_ROUND);
}

function speakWord(word){
    if ('speechSynthesis' in window) {
        const utter = new SpeechSynthesisUtterance(word);
        utter.lang = 'en-US';
        speechSynthesis.speak(utter);
    }
}

function renderCard(){
    answered = false;
    tipDom.innerText = "";
    nextBtn.style.display = "none";
    flipCard.classList.remove('flipped');
    const item = currentList[currentIndex];
    imgDom.src = item.img;
    enDom.innerText = item.en;
    phoneticDom.innerText = item.phonetic;
    backEn.innerText = item.en;
    backPh.innerText = item.phonetic;
    backCn.innerText = item.cn;
    speakWord(item.en);
    optBox.innerHTML = "";
    const randomOpts = shuffle(item.allOpts);
    randomOpts.forEach(optText=>{
        const div = document.createElement('div');
        div.className = "option";
        div.innerText = optText;
        div.onclick = ()=>selectOption(optText, item.cn, div, item);
        optBox.appendChild(div);
    })
    const percent = (currentIndex / currentList.length)*100;
    progressBar.style.width = percent + "%";
}

function selectOption(selectText, answer, el, wordItem){
    if(answered) return;
    answered = true;
    totalAnswer++;
    const allOpts = document.querySelectorAll('.option');
    if(selectText === answer){
        el.classList.add('right');
        tipDom.innerText = "✅ 答对啦！";
        rightCnt++;
    }else{
        el.classList.add('wrong');
        tipDom.innerText = "❌ 答错了";
        allOpts.forEach(o=>{
            if(o.innerText === answer) o.classList.add('right');
        })
        if(!wrongList.find(w=>w.en === wordItem.en)){
            wrongList.push(wordItem);
        }
    }
    updateScore();
    // 强制显示下一题按钮
    nextBtn.style.display = "block";
    reviewWrongBtn.style.display = wrongList.length>0 ? "block" : "none";
}

function updateScore(){
    scoreDom.innerText = rightCnt;
    const r = totalAnswer>0 ? Math.round(rightCnt/totalAnswer*100) :0;
    rateDom.innerText = r+"%";
}

nextBtn.onclick = function(){
    currentIndex++;
    if(currentIndex >= currentList.length){
        const useTime = Math.round((Date.now() - startTime)/1000);
        resultText.innerText = `总题数：${currentList.length}｜答对：${rightCnt}｜答错：${currentList.length-rightCnt}\n正确率：${Math.round(rightCnt/currentList.length*100)}%，用时${useTime}秒`;
        resultModal.style.display="flex";
        progressBar.style.width = "100%";
        return;
    }
    renderCard();
}

flipBtn.onclick = ()=>{
    flipCard.classList.toggle('flipped');
}

resetBtn.onclick = function(){
    startNewGame();
}

reviewWrongBtn.onclick = function(){
    if(wrongList.length ===0) return;
    currentList = shuffle(wrongList);
    currentIndex=0;
    totalAnswer=0;
    rightCnt=0;
    renderCard();
}

function startNewGame(){
    currentList = getRandomRoundQuestions();
    currentIndex=0;
    rightCnt=0;
    totalAnswer=0;
    startTime = Date.now();
    updateScore();
    renderCard();
}
function closeModal(){
    resultModal.style.display="none";
    startNewGame();
}

startNewGame();
</script>
</body>
</html>
